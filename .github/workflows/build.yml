name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WinForms app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Source/ByeDPIControl.csproj

      - name: Publish (framework-dependent)
        run: >
          dotnet publish Source/ByeDPIControl.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/framework-dependent

      - name: Publish (self-contained)
        run: >
          dotnet publish Source/ByeDPIControl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/self-contained

      - name: Assemble release packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if (-not $version -or $version -eq 'main') { $version = '1.0.0' }

          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item 'out/framework-dependent/ByeDPIControl.exe' package/
          Copy-Item 'scripts' package/scripts -Recurse
          Copy-Item 'README.md', 'LICENSE', 'اقرأني.txt' package/ -ErrorAction SilentlyContinue

          Compress-Archive -Path 'package/*' -DestinationPath "ByeDPI-Control-$version-win-x64.zip" -Force
          Compress-Archive -Path 'out/self-contained/ByeDPIControl.exe' -DestinationPath "ByeDPIControl-$version-win-x64-selfcontained.zip" -Force

          Get-FileHash 'ByeDPI-Control-*.zip', 'ByeDPIControl-*.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path 'SHA256SUMS.txt' -Encoding utf8

          Get-ChildItem *.zip, SHA256SUMS.txt | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-control-build
          path: |
            *.zip
            SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            SHA256SUMS.txt
          generate_release_notes: true
